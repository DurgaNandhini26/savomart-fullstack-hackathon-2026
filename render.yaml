# Render blueprint (free web service). The demo DB is rebuilt from the committed snapshot on each deploy.
services:
  - type: web
    name: savo-sitescout
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: none
      - key: ENABLE_REVERSE_GEOCODE
        value: "true"
